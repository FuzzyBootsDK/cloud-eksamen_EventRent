<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a237e">EventRent – IMPLEMENTERET PROTOTYPE</text>
  <text x="480" y="48" text-anchor="middle" fill="#455a64">Alt på denne tegning er bygget og kan demonstreres (dummy-data)</text>

  <!-- Bruger -->
  <rect x="30" y="200" width="130" height="70" rx="8" fill="#e8eaf6" stroke="#1a237e"/>
  <text x="95" y="230" text-anchor="middle" font-weight="700">Bruger</text>
  <text x="95" y="250" text-anchor="middle">Browser</text>

  <!-- AWS cloud -->
  <rect x="215" y="70" width="715" height="250" rx="10" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="230" y="92" font-weight="700" fill="#e65100">AWS Cloud – region eu-north-1 (Stockholm)</text>

  <rect x="245" y="170" width="160" height="80" rx="8" fill="#fff" stroke="#ff8f00"/>
  <text x="325" y="200" text-anchor="middle" font-weight="700">CloudFront</text>
  <text x="325" y="220" text-anchor="middle">HTTPS (443)</text>
  <text x="325" y="238" text-anchor="middle" font-size="11">redirect HTTP→HTTPS</text>

  <rect x="480" y="170" width="170" height="80" rx="8" fill="#fff" stroke="#2e7d32"/>
  <text x="565" y="200" text-anchor="middle" font-weight="700">S3-bucket (privat)</text>
  <text x="565" y="220" text-anchor="middle">index.html</text>
  <text x="565" y="238" text-anchor="middle" font-size="11">SSE-S3 · versionering</text>

  <rect x="725" y="110" width="180" height="70" rx="8" fill="#fff" stroke="#6a1b9a"/>
  <text x="815" y="140" text-anchor="middle" font-weight="700">CloudFormation</text>
  <text x="815" y="160" text-anchor="middle" font-size="11">infra/s3-cloudfront.yaml</text>

  <rect x="725" y="215" width="180" height="70" rx="8" fill="#fff" stroke="#ff8f00" stroke-dasharray="5 4"/>
  <text x="815" y="245" text-anchor="middle" font-weight="700">Amplify Hosting</text>
  <text x="815" y="265" text-anchor="middle" font-size="11">alternativ (PaaS) fra GitHub</text>

  <!-- Lokal -->
  <rect x="215" y="350" width="360" height="140" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="230" y="372" font-weight="700" fill="#0d47a1">Lokal PC (Windows 11)</text>
  <rect x="245" y="390" width="300" height="80" rx="8" fill="#fff" stroke="#1565c0"/>
  <text x="395" y="415" text-anchor="middle" font-weight="700">Docker-container</text>
  <text x="395" y="435" text-anchor="middle">nginx:alpine + index.html</text>
  <text x="395" y="453" text-anchor="middle" font-size="11">port 8080 → 80 (docker-compose)</text>

  <!-- GitHub -->
  <rect x="640" y="380" width="200" height="80" rx="8" fill="#eceff1" stroke="#37474f"/>
  <text x="740" y="410" text-anchor="middle" font-weight="700">GitHub-repo</text>
  <text x="740" y="430" text-anchor="middle" font-size="11">cloud-eksamen_EventRent</text>
  <text x="740" y="446" text-anchor="middle" font-size="11">kode + IaC + Dockerfile</text>

  <!-- Pile -->
  <line x1="160" y1="225" x2="243" y2="215" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="205" text-anchor="middle" font-size="11">DNS + HTTPS</text>
  <line x1="405" y1="210" x2="478" y2="210" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="442" y="202" text-anchor="middle" font-size="11">OAC</text>
  <line x1="725" y1="145" x2="652" y2="190" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="705" y="172" font-size="11" fill="#6a1b9a">opretter</text>
  <line x1="740" y1="380" x2="815" y2="287" stroke="#37474f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="95" y1="270" x2="245" y2="425" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="105" y="365" font-size="11" transform="rotate(46 105 365)">localhost:8080</text>
  <line x1="640" y1="420" x2="547" y2="430" stroke="#37474f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="595" y="415" text-anchor="middle" font-size="11">build</text>

  <!-- Forklaring -->
  <text x="30" y="505" font-size="11" fill="#455a64">Ikke implementeret: database, booking-API, WAF, backup-tjeneste, VPN/SSO – se produktionsdiagrammet.</text>
</svg>
